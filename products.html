<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | The Geek Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { surface: '#121212', primary: '#00ff88' }, fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Space Grotesk', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col font-sans">

  <!-- Include the same <header> and Cart Slider <div> from index.html here for brevity -->
  <header class="bg-surface border-b border-gray-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="font-display text-2xl font-bold tracking-tighter text-white">THE<span class="text-primary">GEEK</span>SHOP.</a>
      <nav class="hidden md:flex gap-8">
        <a href="index.html" class="text-gray-300 hover:text-white transition">Home</a>
        <a href="products.html" class="text-primary font-medium">Shop All</a>
      </nav>
      <button onclick="toggleCart()" class="relative text-white hover:text-primary transition">
        <span class="material-symbols-outlined text-3xl">shopping_cart</span>
        <span class="cart-count absolute -top-2 -right-2 bg-primary text-black text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full">0</span>
      </button>
    </div>
  </header>

  <main class="flex-grow max-w-7xl mx-auto px-4 py-12 w-full">
    <h1 class="font-display text-3xl font-bold mb-8">All Products</h1>
    
    <!-- Product Grid -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Shimmer Loading placeholders -->
      <div class="animate-pulse bg-surface h-80 rounded-xl border border-gray-800"></div>
      <div class="animate-pulse bg-surface h-80 rounded-xl border border-gray-800"></div>
      <div class="animate-pulse bg-surface h-80 rounded-xl border border-gray-800"></div>
      <div class="animate-pulse bg-surface h-80 rounded-xl border border-gray-800"></div>
    </div>
  </main>

  <!-- Include Slide-out Cart HTML from index.html here -->
  <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>
  <div id="cart-slider" class="fixed top-0 right-0 h-full w-full md:w-96 bg-surface border-l border-gray-800 z-50 transform translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
    <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-surface">
      <h2 class="font-display text-xl font-bold">Your Cart</h2>
      <button onclick="toggleCart()" class="text-gray-400 hover:text-white"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div id="cart-items" class="flex-grow overflow-y-auto p-4 space-y-4"></div>
    <div class="p-6 border-t border-gray-800 bg-surface">
      <div class="flex justify-between font-bold text-lg mb-4">
        <span>Total</span>
        <span class="text-primary">$<span class="cart-total">0.00</span></span>
      </div>
      <a href="checkout.html">
        <button id="checkout-btn" class="w-full bg-primary text-black font-bold py-3 rounded hover:bg-emerald-400 transition">Proceed to Checkout</button>
      </a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
