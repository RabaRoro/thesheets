<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Product Details | GEEK.SYS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    body { font-family: 'Space Mono', monospace; background-color: #050505; color: #e2e8f0; }
    .heading { font-family: 'Orbitron', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-fixed">

  <header class="border-b border-cyan-500/30 bg-black/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="heading font-bold text-2xl text-white tracking-widest">GEEK<span class="text-cyan-500">.</span>SYS</a>
      <a href="products.html" class="text-cyan-500 text-sm uppercase hover:text-white flex items-center gap-1"><span class="material-symbols-outlined">arrow_back</span> Return_to_Market</a>
      <button onclick="toggleCart()" class="relative text-cyan-500 hover:text-white flex items-center gap-2">
        <span class="material-symbols-outlined">shopping_cart</span>
        <span class="cart-count bg-cyan-500 text-black text-xs font-bold px-1.5 py-0.5 rounded">0</span>
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-12 flex-1 w-full" id="product-container">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
      <!-- Image Frame -->
      <div class="relative p-2 border border-gray-800 bg-gray-950 shadow-[0_0_20px_rgba(0,255,204,0.05)]">
        <div class="absolute top-4 left-4 z-10 bg-black border border-cyan-500 px-3 py-1 text-xs text-cyan-400 uppercase tracking-widest" id="p-category">CAT</div>
        <img id="p-image" src="" alt="Product" class="w-full h-auto object-cover opacity-90 mix-blend-luminosity hover:mix-blend-normal transition-all duration-500" />
        <!-- Corner decorations -->
        <div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-cyan-500"></div>
        <div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-cyan-500"></div>
      </div>

      <!-- Details -->
      <div class="flex flex-col justify-center space-y-6">
        <div>
          <h1 id="p-name" class="heading text-3xl md:text-5xl font-black text-white uppercase tracking-wider mb-4">Loading...</h1>
          <p id="p-price" class="text-3xl text-cyan-400 heading font-bold">$0.00</p>
        </div>
        
        <p id="p-desc" class="text-gray-400 text-sm md:text-base border-l-2 border-cyan-500/50 pl-4"></p>

        <div>
          <h3 class="text-white uppercase tracking-widest text-xs border-b border-gray-800 pb-2 mb-3">Tech Specs_</h3>
          <ul id="p-specs" class="space-y-2"></ul>
        </div>

        <div class="flex gap-4 pt-4 border-t border-gray-800">
          <input type="number" id="p-qty" value="1" min="1" class="w-20 bg-black border border-gray-700 text-center text-white focus:border-cyan-500 focus:outline-none font-mono" />
          <button id="p-add" class="flex-1 bg-cyan-500 text-black font-bold uppercase tracking-widest py-4 hover:bg-cyan-400 transition-colors shadow-[0_0_15px_rgba(0,255,204,0.2)]">
            Execute_Add_To_Cart
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/80 z-50 hidden backdrop-blur-sm"></div>
  <aside id="cart-slider" class="fixed top-0 right-0 h-full w-full max-w-sm bg-black border-l border-cyan-500/50 z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
    <div class="p-4 border-b border-gray-800 flex items-center justify-between bg-gray-900/50">
      <h3 class="heading font-bold text-lg text-cyan-500 uppercase tracking-widest">Cart_Memory</h3>
      <button onclick="toggleCart()" class="text-gray-400 hover:text-white"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div id="cart-items" class="p-4 flex-1 overflow-y-auto space-y-4"></div>
    <div class="p-4 border-t border-cyan-500/30 bg-gray-950 space-y-4">
      <div class="flex justify-between text-lg font-bold text-white heading">
        <span>Total_Credits:</span><span id="cart-total" class="text-cyan-400">$0.00</span>
      </div>
      <a href="checkout.html" class="block w-full text-center bg-cyan-500 text-black uppercase tracking-widest font-bold py-3 hover:bg-cyan-400 transition-colors">Init Checkout</a>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
