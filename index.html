<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E-Commerce Store & Admin</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f4f4f9; }
    h2 { border-bottom: 2px solid #ccc; padding-bottom: 5px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 40px; }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
    .out-of-stock { color: red; font-weight: bold; }
    .in-stock { color: green; font-weight: bold; }
    form { background: white; padding: 15px; border-radius: 8px; max-width: 400px; }
    form input { display: block; width: 95%; margin-bottom: 10px; padding: 8px; }
    button { background: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>Storefront</h2>
  <div id="product-grid" class="grid">Loading products...</div>

  <h2>Admin Panel - Add Product</h2>
  <form id="add-product-form">
    <input type="text" id="name" placeholder="Product Name" required>
    <input type="number" id="price" placeholder="Price ($)" step="0.01" required>
    <input type="number" id="stock" placeholder="Stock Quantity" required>
    <input type="url" id="image" placeholder="Image URL" required>
    <button type="submit">Add Product</button>
  </form>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxVIYe8ln2VjYz1xFhpX2CVVc4dDZWDHirc4QdUtPYtdTTkUREuXpEA3XnSC_dgnO931w/exec";

    async function fetchProducts() {
      const container = document.getElementById('product-grid');
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        container.innerHTML = '';

        data.forEach(p => {
          const isAvailable = p.stock > 0;
          container.innerHTML += `
            <div class="card">
              <img src="${p.image}" alt="${p.name}">
              <h3>${p.name}</h3>
              <p>Price: $${p.price}</p>
              <p class="${isAvailable ? 'in-stock' : 'out-of-stock'}">
                ${isAvailable ? `In Stock (${p.stock})` : 'Out of Stock'}
              </p>
            </div>
          `;
        });
      } catch (err) {
        container.innerHTML = 'Failed to load products.';
      }
    }

    document.getElementById('add-product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newProduct = {
        id: Date.now(),
        name: document.getElementById('name').value,
        price: document.getElementById('price').value,
        stock: document.getElementById('stock').value,
        image: document.getElementById('image').value
      };

      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newProduct)
      });

      alert('Product submitted! Refreshing...');
      document.getElementById('add-product-form').reset();
      setTimeout(fetchProducts, 1500);
    });

    fetchProducts();
  </script>
</body>
</html>
