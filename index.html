<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEO-MARKET | The Geek Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    body { font-family: 'Space Mono', monospace; background-color: #050505; color: #e2e8f0; }
    h1, h2, h3, .heading { font-family: 'Orbitron', sans-serif; }
    .neon-border { box-shadow: 0 0 10px rgba(0, 255, 204, 0.2), inset 0 0 10px rgba(0, 255, 204, 0.1); }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-fixed">

  <!-- Nav -->
  <header class="border-b border-cyan-500/30 bg-black/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="heading font-bold text-2xl text-white tracking-widest">GEEK<span class="text-cyan-500">.</span>SYS</a>
      <nav class="hidden md:flex items-center gap-6 text-sm uppercase">
        <a href="index.html" class="text-cyan-500 border-b border-cyan-500 pb-1">Nexus</a>
        <a href="products.html" class="text-gray-400 hover:text-cyan-400">Hardware</a>
        <a href="lacing-status.html" class="text-gray-400 hover:text-cyan-400">Telemetry</a>
      </nav>
      <button onclick="toggleCart()" class="relative text-cyan-500 hover:text-white flex items-center gap-2">
        <span class="material-symbols-outlined">shopping_cart</span>
        <span class="cart-count bg-cyan-500 text-black text-xs font-bold px-1.5 py-0.5 rounded">0</span>
      </button>
    </div>
  </header>

  <!-- Hero -->
  <section class="relative py-24 px-4 border-b border-gray-900 bg-gradient-to-b from-black to-gray-950 overflow-hidden">
    <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1555680202-c86f0e12f086?auto=format&fit=crop&q=80&w=2000')] bg-cover bg-center opacity-10 mix-blend-screen"></div>
    <div class="max-w-4xl mx-auto text-center relative z-10 space-y-6">
      <div class="inline-block border border-cyan-500/50 bg-cyan-500/10 px-4 py-1 text-cyan-400 text-xs tracking-widest uppercase">SYS.BOOT_SEQUENCE_INIT</div>
      <h1 class="heading text-5xl md:text-7xl font-black text-white tracking-tighter uppercase drop-shadow-[0_0_15px_rgba(0,255,204,0.5)]">
        Upgrade Your <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600">Hardware</span>
      </h1>
      <p class="text-gray-400 max-w-2xl mx-auto text-sm md:text-base">Cybernetics, neural links, and tactical outerwear for the modern netrunner. Authorized personnel only.</p>
      <div class="pt-6 flex justify-center gap-4">
        <a href="products.html" class="bg-cyan-500 text-black font-bold uppercase tracking-widest px-8 py-3 hover:bg-cyan-400 transition-colors shadow-[0_0_15px_rgba(0,255,204,0.4)]">Access Market</a>
      </div>
    </div>
  </section>

  <!-- Featured -->
  <main class="max-w-7xl mx-auto px-4 py-16 flex-1 w-full">
    <div class="flex justify-between items-end border-b border-gray-800 pb-4 mb-8">
      <h2 class="heading text-2xl text-white uppercase tracking-widest">Trending_Tech</h2>
      <a href="products.html" class="text-cyan-500 text-xs uppercase hover:text-white flex items-center gap-1">View_All <span class="material-symbols-outlined text-sm">chevron_right</span></a>
    </div>
    <div id="featured-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
  </main>

  <!-- Side Cart (Shared across files) -->
  <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/80 z-50 hidden backdrop-blur-sm"></div>
  <aside id="cart-slider" class="fixed top-0 right-0 h-full w-full max-w-sm bg-black border-l border-cyan-500/50 z-50 transform translate-x-full transition-transform duration-300 flex flex-col neon-border">
    <div class="p-4 border-b border-gray-800 flex items-center justify-between bg-gray-900/50">
      <h3 class="heading font-bold text-lg text-cyan-500 uppercase tracking-widest">Cart_Memory</h3>
      <button onclick="toggleCart()" class="text-gray-400 hover:text-white"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div id="cart-items" class="p-4 flex-1 overflow-y-auto space-y-4"></div>
    <div class="p-4 border-t border-cyan-500/30 bg-gray-950 space-y-4">
      <div class="flex justify-between text-lg font-bold text-white heading">
        <span>Total_Credits:</span>
        <span id="cart-total" class="text-cyan-400">$0.00</span>
      </div>
      <a href="checkout.html" class="block w-full text-center bg-cyan-500 text-black uppercase tracking-widest font-bold py-3 hover:bg-cyan-400 transition-colors">Init Checkout</a>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
