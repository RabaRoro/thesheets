<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard | The Geek Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { colors: { surface: '#121212', primary: '#00ff88' }, fontFamily: { sans: ['Inter'], display: ['Space Grotesk'] } } } }
  </script>
</head>
<body class="bg-black text-white min-h-screen font-sans">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="max-w-sm mx-auto mt-32 p-8 bg-surface rounded-xl border border-gray-800 shadow-2xl">
    <h2 class="font-display text-2xl font-bold text-center mb-6 text-primary">Admin Login</h2>
    <form id="login-form" class="space-y-4">
      <input type="text" id="username" placeholder="Username" required class="w-full bg-black border border-gray-700 rounded p-3 text-white">
      <input type="password" id="password" placeholder="Password" required class="w-full bg-black border border-gray-700 rounded p-3 text-white">
      <button type="submit" id="login-btn" class="w-full bg-primary text-black font-bold py-3 rounded">Log In</button>
    </form>
    <p id="login-error" class="text-red-500 text-sm mt-4 text-center hidden">Invalid credentials</p>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div id="dashboard-screen" class="hidden max-w-6xl mx-auto p-6">
    <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
      <h2 class="font-display text-3xl font-bold">Store Command Center</h2>
      <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded font-bold hover:bg-red-600 transition">Log Out</button>
    </div>

    <div class="flex gap-4 mb-6">
      <button onclick="switchTab('orders')" id="tab-btn-orders" class="tab-btn px-6 py-2 rounded bg-primary text-black font-bold">Orders</button>
      <button onclick="switchTab('add-product')" id="tab-btn-add-product" class="tab-btn px-6 py-2 rounded bg-surface border border-gray-700 text-gray-300 font-bold">Add Product</button>
    </div>

    <!-- Orders Tab -->
    <div id="tab-orders" class="tab-content block bg-surface rounded-xl border border-gray-800 overflow-hidden">
      <div class="p-4 border-b border-gray-800 flex justify-between items-center">
        <h3 class="font-bold text-lg">Recent Orders</h3>
        <button onclick="fetchOrders()" class="text-sm bg-gray-700 px-3 py-1 rounded hover:bg-gray-600">Refresh</button>
      </div>
      <div class="overflow-x-auto p-4">
        <table class="w-full text-left text-sm">
          <thead class="text-gray-400 border-b border-gray-700">
            <tr>
              <th class="pb-3">Order ID / Date</th>
              <th class="pb-3">Customer</th>
              <th class="pb-3">Items</th>
              <th class="pb-3">Total</th>
              <th class="pb-3">Status</th>
            </tr>
          </thead>
          <tbody id="orders-table-body" class="divide-y divide-gray-800">
            <tr><td colspan="5" class="py-4 text-center">Loading orders...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Add Product Tab -->
    <div id="tab-add-product" class="tab-content hidden max-w-xl bg-surface p-6 rounded-xl border border-gray-800">
      <h3 class="font-bold text-lg mb-4 border-b border-gray-800 pb-2">Add New Product</h3>
      <form id="add-product-form" class="space-y-4">
        <input type="text" id="p-name" placeholder="Product Name" required class="w-full bg-black border border-gray-700 rounded p-3">
        <input type="number" id="p-price" placeholder="Price ($)" step="0.01" required class="w-full bg-black border border-gray-700 rounded p-3">
        <input type="number" id="p-stock" placeholder="Stock Quantity" required class="w-full bg-black border border-gray-700 rounded p-3">
        <input type="url" id="p-image" placeholder="Image URL (e.g. from Imgur)" required class="w-full bg-black border border-gray-700 rounded p-3">
        <button type="submit" class="w-full bg-primary text-black font-bold py-3 rounded">Add to Database</button>
      </form>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxYau4l1KrMfvaf4f7lUYFw6eLriddA3djUC9Qh8XQMQIcqAyioAwv7T4xqHgrwfmsNnw/exec";

    // Authentication Logic
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      
      btn.innerText = "Authenticating...";
      try {
        const res = await fetch(`${API_URL}?action=LOGIN&user=${encodeURIComponent(u)}&pass=${encodeURIComponent(p)}`);
        const data = await res.json();
        if (data.success) {
          sessionStorage.setItem('admin_user', u);
          sessionStorage.setItem('admin_pass', p);
          showDashboard();
        } else {
          document.getElementById('login-error').classList.remove('hidden');
        }
      } catch (err) { alert("Network error connecting to Google."); } 
      finally { btn.innerText = "Log In"; }
    });

    if (sessionStorage.getItem('admin_user')) showDashboard();

    function showDashboard() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.remove('hidden');
      fetchOrders();
    }

    function logout() {
      sessionStorage.clear();
      location.reload();
    }

    // Tabs
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('bg-primary', 'text-black');
        b.classList.add('bg-surface', 'text-gray-300');
      });
      
      document.getElementById('tab-' + tabId).classList.remove('hidden');
      const activeBtn = document.getElementById('tab-btn-' + tabId);
      activeBtn.classList.remove('bg-surface', 'text-gray-300');
      activeBtn.classList.add('bg-primary', 'text-black');
    }

    // Fetch Orders
    async function fetchOrders() {
      const u = sessionStorage.getItem('admin_user');
      const p = sessionStorage.getItem('admin_pass');
      const tbody = document.getElementById('orders-table-body');
      tbody.innerHTML = '<tr><td colspan="5" class="py-4 text-center animate-pulse">Fetching from Google Sheets...</td></tr>';
      
      try {
        const res = await fetch(`${API_URL}?action=FETCH_ORDERS&user=${encodeURIComponent(u)}&pass=${encodeURIComponent(p)}`);
        const data = await res.json();
        if (!data.success) return logout();
        
        tbody.innerHTML = '';
        if (data.orders.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="py-4 text-center text-gray-500">No orders found.</td></tr>';
          return;
        }

        data.orders.forEach(ord => {
          tbody.innerHTML += `
            <tr class="hover:bg-gray-800 transition">
              <td class="py-3 pr-2"><span class="text-xs text-primary block">${ord["Order ID"]}</span><span class="text-gray-400 text-xs">${ord["Date"]}</span></td>
              <td class="py-3 pr-2"><strong>${ord["Customer Name"]}</strong><br><span class="text-xs text-gray-400">${ord["Phone"]}</span></td>
              <td class="py-3 pr-2 text-xs">${ord["Items"]}</td>
              <td class="py-3 pr-2 font-bold text-white">$${ord["Total ($)"]}<br><span class="text-xs font-normal text-gray-400">${ord["Payment Method"]}</span></td>
              <td class="py-3 pr-2 text-yellow-500 font-bold text-xs">${ord["Status"]}</td>
            </tr>
          `;
        });
      } catch (err) { tbody.innerHTML = '<tr><td colspan="5" class="py-4 text-red-500 text-center">Error loading orders.</td></tr>'; }
    }

    // Add Product
    document.getElementById('add-product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        action: "ADD_PRODUCT",
        user: sessionStorage.getItem('admin_user'), pass: sessionStorage.getItem('admin_pass'),
        id: Date.now(),
        name: document.getElementById('p-name').value,
        price: document.getElementById('p-price').value,
        stock: document.getElementById('p-stock').value,
        image: document.getElementById('p-image').value
      };

      try {
        await fetch(API_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        alert('Product added successfully!');
        document.getElementById('add-product-form').reset();
      } catch (err) { alert("Failed to add product."); }
    });
  </script>
</body>
</html>
